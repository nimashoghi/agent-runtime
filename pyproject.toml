[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "agent-runtime-py"
version = "0.2.0"
description = "Reconnectable native agent workers with durable input receipts and events"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
  "claude-agent-sdk==0.2.159",
  "filelock>=3.16,<4",
  "platformdirs>=4,<5",
  "psutil>=7,<8",
  "typed-agent-hooks>=0.3,<0.4",
]

[project.urls]
Repository = "https://github.com/nimashoghi/agent-runtime"

# Delete after typed-agent-hooks 0.3.0 is on PyPI, then run `uv lock`.
[tool.uv.sources]
typed-agent-hooks = { git = "https://github.com/nimashoghi/typed-agent-hooks", rev = "e7a994fc8d7079199159ec20930d66a191442f8a" }

[tool.hatch.build.targets.wheel]
packages = ["src/agent_runtime"]

[dependency-groups]
dev = ["pytest>=8.4,<9", "pytest-asyncio>=1.1,<2", "ruff>=0.12,<1", "basedpyright>=1.31,<2", "build>=1.3,<2"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.basedpyright]
pythonVersion = "3.11"
typeCheckingMode = "standard"
include = ["src"]
